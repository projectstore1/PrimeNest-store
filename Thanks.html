<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Submitted - PremiumStore</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="theme-toggle" id="themeToggle">
        <i class="fas fa-moon"></i>
    </div>

    <header class="header">
        <div class="container">
            <div class="logo">
                <img src="https://via.placeholder.com/40x40?text=PS" alt="PremiumStore">
                <span>PremiumStore</span>
            </div>
            <nav class="nav">
                <a href="index.html"><i class="fas fa-home"></i> Home</a>
                <a href="order-history.html"><i class="fas fa-history"></i> Orders</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="thanks-container">
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h1>Order Submitted!</h1>
            <p>Your order has been submitted successfully.</p>
            <div class="order-details" id="orderDetails">
                <p><strong>Product:</strong> <span id="productName">Loading...</span></p>
                <p><strong>Item:</strong> <span id="itemName">Loading...</span></p>
                <p><strong>Amount:</strong> <span id="amount">Loading...</span></p>
                <p><strong>Currency:</strong> <span id="currency">Loading...</span></p>
            </div>
            <div class="thanks-actions">
                <a href="index.html" class="btn-primary"><i class="fas fa-home"></i> Continue Shopping</a>
                <a href="order-history.html" class="btn-secondary"><i class="fas fa-history"></i> View Orders</a>
            </div>
        </div>
    </main>

    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>

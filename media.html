<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media - PremiumStore Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="cs/admin.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">🏪 PremiumStore</div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
                <a href="products.html"><i class="fas fa-box"></i> Products</a>
                <a href="orders.html"><i class="fas fa-shopping-cart"></i> Orders</a>
                <a href="payments.html"><i class="fas fa-credit-card"></i> Payments</a>
                <a href="media.html" class="active"><i class="fas fa-image"></i> Media</a>
                <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
            </nav>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <h1>🖼️ Media</h1>
                <div class="theme-toggle" id="themeToggle">🌙</div>
            </header>

            <div class="settings-container">
                <div class="settings-section">
                    <h3><i class="fas fa-images"></i> Banners</h3>
                    <div id="bannersList"></div>
                    <button class="btn-add" id="addBannerBtn"><i class="fas fa-plus"></i> Add Banner</button>
                </div>
            </div>

            <!-- Banner Modal (শুধু Image Link) -->
            <div class="modal" id="bannerModal" style="display:none;">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3 id="bannerModalTitle">Add Banner</h3>
                        <button class="modal-close" id="bannerModalClose">&times;</button>
                    </div>
                    <form id="bannerForm">
                        <input type="hidden" id="editBannerId">
                        <div class="form-group">
                            <label><i class="fas fa-image"></i> Banner Image URL *</label>
                            <input type="url" id="bannerImage" placeholder="https://example.com/banner.jpg" required>
                            <small style="color:var(--text-muted);font-size:0.8rem;">পেস্ট করুন আপনার banner ইমেজ এর লিংক</small>
                        </div>
                        <div style="margin-top:16px;padding:16px;background:var(--bg-primary);border-radius:16px;border:1px solid var(--border-color);">
                            <h4 style="font-size:0.9rem;color:var(--text-secondary);margin-bottom:10px;"><i class="fas fa-eye"></i> Preview</h4>
                            <div id="bannerPreview" style="width:100%;height:130px;border-radius:12px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);display:flex;align-items:center;justify-content:center;color:white;text-align:center;padding:20px;background-size:cover;background-position:center;position:relative;overflow:hidden;">
                                <div style="position:relative;z-index:1;text-shadow:0 2px 15px rgba(0,0,0,0.5);">
                                    <i class="fas fa-image" style="font-size:2.5rem;display:block;margin-bottom:6px;"></i>
                                    <h5 style="font-size:1.2rem;font-weight:700;">Banner Preview</h5>
                                    <p style="font-size:0.85rem;opacity:0.9;">Enter image URL to preview</p>
                                </div>
                            </div>
                        </div>
                        <div style="display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;">
                            <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Save Banner</button>
                            <button type="button" class="btn-secondary" id="bannerModalCancel">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/media.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media - PremiumStore Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="cs/admin.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">🏪 PremiumStore</div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
                <a href="products.html"><i class="fas fa-box"></i> Products</a>
                <a href="orders.html"><i class="fas fa-shopping-cart"></i> Orders</a>
                <a href="payments.html"><i class="fas fa-credit-card"></i> Payments</a>
                <a href="media.html" class="active"><i class="fas fa-image"></i> Media</a>
                <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
            </nav>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <h1>🖼️ Media</h1>
                <div class="theme-toggle" id="themeToggle">🌙</div>
            </header>

            <div class="settings-container">
                <div class="settings-section">
                    <h3><i class="fas fa-images"></i> Banners</h3>
                    <div id="bannersList"></div>
                    <button class="btn-add" id="addBannerBtn"><i class="fas fa-plus"></i> Add Banner</button>
                </div>
            </div>

            <div class="modal" id="bannerModal" style="display:none;">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3 id="bannerModalTitle">Add Banner</h3>
                        <button class="modal-close" id="bannerModalClose">&times;</button>
                    </div>
                    <form id="bannerForm">
                        <input type="hidden" id="editBannerId">
                        <div class="form-group"><label>Title *</label><input type="text" id="bannerTitle" required></div>
                        <div class="form-group"><label>Subtitle</label><input type="text" id="bannerSubtitle"></div>
                        <div class="form-group"><label>Icon</label><input type="text" id="bannerIcon" value="fas fa-image"></div>
                        <div class="form-group"><label>Background</label><input type="text" id="bannerBg" value="linear-gradient(135deg,#667eea 0%,#764ba2 100%)"></div>
                        <div class="form-group"><label>Link</label><input type="text" id="bannerLink"></div>
                        <div class="form-group"><label>Order</label><input type="number" id="bannerOrder" value="0"></div>
                        <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Save</button>
                        <button type="button" class="btn-secondary" id="bannerModalCancel">Cancel</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/media.js"></script>
</body>
</html>

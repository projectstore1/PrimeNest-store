<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium store- Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="Assets/css/style.css">
</head>
<body>
    <!-- Dark/Light Mode Toggle -->
    <div class="theme-toggle" id="themeToggle">
        <i class="fas fa-moon"></i>
    </div>

    <!-- Support Button -->
    <div class="support-btn">
        <a href="https://t.me/abdullha2" target="_blank">
            <i class="fab fa-telegram-plane"></i>
        </a>
        <a href="https://wa.me/message/NSIUKXADRUXJA1" target="_blank">
            <i class="fab fa-whatsapp"></i>
        </a>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <img src="https://www.image2url.com/r2/default/images/1786765708686-cd1cda4a-5889-437e-9768-20204165b150.jpg" alt="PremiumStore">
                <span>Premium Store</span>
            </div>
            <nav class="nav">
                <a href="home.html" class="active"><i class="fas fa-home"></i> Home</a>
                <a href="Order_history.html"><i class="fas fa-history"></i> Orders</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- ===== BANNER SLIDER ===== -->
        <div class="banner-slider" id="bannerSlider">
            <div class="slides" id="slides">
                <!-- Banners will be loaded from Firebase -->
            </div>
            <div class="slider-dots" id="sliderDots">
                <!-- Dots will be loaded from Firebase -->
            </div>
        </div>

        <!-- ===== NOTICE LINE ===== -->
        <div class="notice-line" id="noticeLine">
            <i class="fas fa-credit-card"></i>
            <span><strong>Pay:</strong> <span id="paymentMethods">Loading...</span></span>
            <i class="fas fa-shield-alt"></i>
        </div>

        <!-- ===== PRODUCTS ===== -->
        <h2 class="section-title"><i class="fas fa-tag"></i> Top Picks</h2>
        <div class="product-grid" id="productGrid">
            <!-- Products will be loaded from Firebase -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>Developed by Abdullha Khan <i class="fas fa-code"></i></p>
        </div>
    </footer>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="Assets/js/firebase-config.js"></script>
    <script src="Assets/js/app.js"></script>
</body>
</html>

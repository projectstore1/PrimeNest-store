<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders - PremiumStore Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="cs/admin.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">🏪 PremiumStore</div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
                <a href="products.html"><i class="fas fa-box"></i> Products</a>
                <a href="orders.html" class="active"><i class="fas fa-shopping-cart"></i> Orders</a>
                <a href="payments.html"><i class="fas fa-credit-card"></i> Payments</a>
                <a href="media.html"><i class="fas fa-image"></i> Media</a>
                <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
            </nav>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <h1>🛒 Orders</h1>
                <div class="theme-toggle" id="themeToggle">🌙</div>
            </header>

            <div class="admin-toolbar">
                <button class="btn-add" id="addOrderBtn"><i class="fas fa-plus"></i> Add Order</button>
                <button class="btn-refresh" id="refreshBtn"><i class="fas fa-sync"></i> Refresh</button>
            </div>

            <div id="ordersContainer"><div style="text-align:center;padding:40px;"><i class="fas fa-spinner fa-spin"></i><p>Loading...</p></div></div>

            <!-- Modal -->
            <div class="modal" id="orderModal" style="display:none;">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>Add Order</h3>
                        <button class="modal-close" id="orderModalClose">&times;</button>
                    </div>
                    <form id="orderForm">
                        <div class="form-group"><label>Order ID</label><input type="text" id="orderId" placeholder="ORD-12345678"></div>
                        <div class="form-group"><label>Product *</label><input type="text" id="orderProduct" required></div>
                        <div class="form-group"><label>Item</label><input type="text" id="orderItem" placeholder="1 Month"></div>
                        <div class="form-group"><label>Amount (USD) *</label><input type="number" id="orderAmount" step="0.01" required></div>
                        <div class="form-group"><label>Status</label>
                            <select id="orderStatus">
                                <option value="pending">Pending</option>
                                <option value="completed">Completed</option>
                                <option value="cancelled">Cancelled</option>
                            </select>
                        </div>
                        <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Save</button>
                        <button type="button" class="btn-secondary" id="orderModalCancel">Cancel</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/orders.js"></script>
</body>
</html>

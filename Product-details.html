<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - PremiumStore</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .product-details-container {
            max-width: 900px;
            margin: 30px auto;
            background: var(--bg-secondary);
            border-radius: 32px;
            padding: 32px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        .product-details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: start;
        }

        .product-details-image {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 24px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
        }

        .product-details-info h1 {
            font-size: 2rem;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .product-details-price {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--accent);
            margin: 12px 0;
        }

        .product-details-price span {
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .product-details-naira {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .product-details-status {
            display: inline-block;
            padding: 6px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            margin: 8px 0 16px;
        }

        .status-available {
            background: #dcfce7;
            color: #166534;
        }

        .status-soldout {
            background: #fef2f2;
            color: #dc2626;
        }

        [data-theme="dark"] .status-available {
            background: #166534;
            color: #dcfce7;
        }

        [data-theme="dark"] .status-soldout {
            background: #7f1d1d;
            color: #fecaca;
        }

        .product-details-description {
            color: var(--text-secondary);
            line-height: 1.8;
            margin: 16px 0 20px;
            padding: 16px 20px;
            background: var(--bg-primary);
            border-radius: 16px;
            border-left: 4px solid var(--accent);
        }

        .product-items-section {
            margin: 20px 0;
        }

        .product-items-section h3 {
            color: var(--text-primary);
            margin-bottom: 12px;
            font-size: 1.1rem;
        }

        .items-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .item-option {
            padding: 12px 16px;
            background: var(--bg-primary);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .item-option:hover {
            border-color: var(--accent);
            background: var(--notice-bg);
        }

        .item-option.active {
            border-color: var(--accent);
            background: var(--notice-bg);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .item-option .item-icon {
            font-size: 1.2rem;
            color: var(--accent);
        }

        .item-option .item-name {
            flex: 1;
        }

        .item-option .item-price {
            font-weight: 700;
            color: var(--accent);
            font-size: 0.9rem;
        }

        .product-details-actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
            flex-wrap: wrap;
        }

        .btn-buy {
            flex: 1;
            padding: 16px 32px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-width: 160px;
        }

        .btn-buy:hover:not(:disabled) {
            background: var(--accent-hover);
            transform: scale(1.02);
        }

        .btn-buy:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-back {
            padding: 16px 24px;
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 2px solid var(--border-color);
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-back:hover {
            background: var(--border-color);
        }

        .similar-products {
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        .similar-products h3 {
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .similar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
        }

        .similar-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 12px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .similar-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: var(--accent);
        }

        .similar-card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 8px;
        }

        .similar-card .similar-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .similar-card .similar-price {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 700;
        }

        .no-item-selected {
            text-align: center;
            padding: 12px;
            color: #dc2626;
            font-weight: 600;
            display: none;
        }

        @media (max-width: 768px) {
            .product-details-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .product-details-container {
                padding: 20px;
                margin: 16px;
                border-radius: 20px;
            }

            .items-grid {
                grid-template-columns: 1fr;
            }

            .product-details-actions {
                flex-direction: column;
            }

            .btn-buy {
                width: 100%;
            }

            .product-details-info h1 {
                font-size: 1.5rem;
            }

            .product-details-price {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 480px) {
            .product-details-container {
                padding: 16px;
                margin: 10px;
                border-radius: 16px;
            }

            .similar-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .product-details-info h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="theme-toggle" id="themeToggle">
        <i class="fas fa-moon"></i>
    </div>

    <header class="header">
        <div class="container">
            <div class="logo">
                <img src="https://via.placeholder.com/40x40?text=PS" alt="PremiumStore">
                <span>PremiumStore</span>
            </div>
            <nav class="nav">
                <a href="PrimeNest.html"><i class="fas fa-home"></i> Home</a>
                <a href="Order_history.html"><i class="fas fa-history"></i> Orders</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="product-details-container" id="productDetails">
            <div class="product-details-grid">
                <!-- Image -->
                <div>
                    <img class="product-details-image" id="detailImage" src="" alt="">
                </div>

                <!-- Info -->
                <div class="product-details-info">
                    <h1 id="detailName">Loading...</h1>
                    <div class="product-details-price" id="detailPrice">$0.00 <span>USD</span></div>
                    <div class="product-details-naira" id="detailNaira">₦0</div>
                    <span class="product-details-status" id="detailStatus">Available</span>

                    <div class="product-details-description" id="detailDescription">
                        <i class="fas fa-info-circle" style="color:var(--accent);margin-right:8px;"></i>
                        Loading product details...
                    </div>

                    <!-- Items Section -->
                    <div class="product-items-section">
                        <h3><i class="fas fa-list" style="color:var(--accent);"></i> Select Your Item</h3>
                        <div class="items-grid" id="itemsGrid">
                            <!-- Items will be loaded from Firebase -->
                        </div>
                        <div class="no-item-selected" id="noItemSelected">
                            <i class="fas fa-exclamation-circle"></i> Please select an item
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="product-details-actions">
                        <button class="btn-buy" id="buyNowBtn">
                            <i class="fas fa-shopping-cart"></i> Buy Now
                        </button>
                        <a href="PrimeNest.html" class="btn-back">
                            <i class="fas fa-arrow-left"></i> Back
                        </a>
                    </div>
                </div>
            </div>

            <!-- Similar Products -->
            <div class="similar-products" id="similarProducts">
                <h3><i class="fas fa-tags" style="color:var(--accent);"></i> You May Also Like</h3>
                <div class="similar-grid" id="similarGrid"></div>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="Assets/js/firebase-config.js"></script>
    <script src="Assets/js/product-details.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Order History - PremiumStore</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="Assets/css/style.css">
    <style>
        /* ============================================================
           EXTRA CSS (শুধু এই পেজের জন্য)
           ============================================================ */
        .orders-container {
            margin: 20px 0 40px;
        }

        .order-item {
            background: var(--bg-card);
            padding: 20px 24px;
            border-radius: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            transition: all 0.3s ease;
        }

        .order-item:hover {
            border-color: var(--accent);
            box-shadow: var(--shadow-hover);
            transform: translateX(4px);
        }

        .order-item .order-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .order-item .order-info .order-id {
            font-weight: 700;
            color: var(--accent);
            font-size: 1.05rem;
        }

        .order-item .order-info .order-product {
            color: var(--text-primary);
            font-weight: 500;
        }

        .order-item .order-info .order-detail {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .order-item .order-info .order-date {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .order-item .order-right {
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-end;
        }

        .order-item .order-right .order-amount {
            font-weight: 700;
            color: var(--accent);
            font-size: 1.2rem;
        }

        .order-item .order-status {
            padding: 4px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            display: inline-block;
        }

        .status-completed {
            background: #dcfce7;
            color: #166534;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-cancelled {
            background: #fef2f2;
            color: #dc2626;
        }

        [data-theme="dark"] .status-completed {
            background: #166534;
            color: #dcfce7;
        }

        [data-theme="dark"] .status-pending {
            background: #92400e;
            color: #fef3c7;
        }

        [data-theme="dark"] .status-cancelled {
            background: #7f1d1d;
            color: #fecaca;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3rem;
            display: block;
            margin-bottom: 16px;
            color: var(--border-color);
        }

        .empty-state h3 {
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .loading i {
            font-size: 2rem;
            display: block;
            margin-bottom: 12px;
            color: var(--accent);
        }

        /* ===== FEEDBACK SECTION ===== */
        .feedback-section {
            margin: 40px 0 60px;
        }

        .feedback-form {
            background: var(--bg-secondary);
            padding: 24px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }

        .feedback-form h3 {
            margin-bottom: 12px;
            color: var(--text-primary);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .feedback-form h3 i {
            color: var(--accent);
        }

        .star-rating {
            display: flex;
            gap: 8px;
            margin: 12px 0;
        }

        .star-rating i {
            font-size: 2rem;
            cursor: pointer;
            color: var(--border-color);
            transition: all 0.2s;
        }

        .star-rating i.active {
            color: #eab308;
        }

        .star-rating i:hover {
            transform: scale(1.1);
        }

        .feedback-form input,
        .feedback-form textarea {
            background: var(--input-bg);
            color: var(--text-primary);
            border: 2px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 16px;
            width: 100%;
            margin: 8px 0;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .feedback-form input:focus,
        .feedback-form textarea:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .feedback-form textarea {
            min-height: 80px;
            resize: vertical;
        }

        .feedback-list {
            background: var(--bg-secondary);
            padding: 24px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        .feedback-list h3 {
            margin-bottom: 16px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .feedback-list h3 i {
            color: var(--accent);
        }

        .feedback-item {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 12px;
            transition: all 0.2s;
        }

        .feedback-item:hover {
            background: var(--bg-primary);
            border-radius: 12px;
        }

        .feedback-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .feedback-item .fb-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .feedback-item .fb-user {
            font-weight: 700;
            color: var(--accent);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .feedback-item .fb-stars {
            color: #eab308;
            font-size: 0.95rem;
        }

        .feedback-item .fb-text {
            color: var(--text-secondary);
            margin: 4px 0;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .feedback-item .fb-date {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .btn-primary {
            padding: 12px 24px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            justify-content: center;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: scale(1.02);
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            .order-item {
                flex-direction: column;
                align-items: flex-start;
                padding: 16px 18px;
            }
            .order-item .order-right {
                align-items: flex-start;
                width: 100%;
            }
            .section-title {
                font-size: 1.2rem;
            }
        }

        @media (max-width: 480px) {
            .order-item {
                padding: 14px 16px;
            }
            .feedback-form {
                padding: 16px;
            }
            .feedback-list {
                padding: 16px;
            }
            .star-rating i {
                font-size: 1.6rem;
            }
            .feedback-form input,
            .feedback-form textarea {
                font-size: 0.85rem;
                padding: 10px 14px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== THEME TOGGLE ===== -->
    <div class="theme-toggle" id="themeToggle">
        <i class="fas fa-moon"></i>
    </div>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <img src="https://via.placeholder.com/40x40?text=PS" alt="PremiumStore">
                <span>PremiumStore</span>
            </div>
            <nav class="nav">
                <a href="index.html"><i class="fas fa-home"></i> Home</a>
                <a href="order-history.html" class="active"><i class="fas fa-history"></i> Orders</a>
            </nav>
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="container">
        <h2 class="section-title"><i class="fas fa-history"></i> Latest Orders (30)</h2>
        <div class="orders-container" id="ordersContainer">
            <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading orders...</div>
        </div>

        <!-- ===== FEEDBACK SECTION ===== -->
        <div class="feedback-section">
            <h2 class="section-title"><i class="fas fa-star"></i> Reviews & Feedback</h2>
            
            <!-- Feedback Form -->
            <div class="feedback-form">
                <h3><i class="fas fa-pen"></i> Leave a Review</h3>
                <div class="star-rating" id="starRating">
                    <i class="fas fa-star" data-rating="1"></i>
                    <i class="fas fa-star" data-rating="2"></i>
                    <i class="fas fa-star" data-rating="3"></i>
                    <i class="fas fa-star" data-rating="4"></i>
                    <i class="fas fa-star" data-rating="5"></i>
                </div>
                <input type="text" id="feedbackTwitter" placeholder="Your Twitter/X username">
                <textarea id="feedbackText" placeholder="Write your review..." rows="3"></textarea>
                <button id="submitFeedback" class="btn-primary"><i class="fas fa-paper-plane"></i> Submit Feedback</button>
            </div>

            <!-- Feedback List -->
            <div class="feedback-list">
                <h3><i class="fas fa-comment-dots"></i> Customer Reviews</h3>
                <div id="feedbackContainer">
                    <div class="empty-state">
                        <i class="fas fa-comment"></i>
                        <p>No reviews yet. Be the first!</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <div class="container">
            <p>Developed by Abdullha Khan <i class="fas fa-code"></i></p>
        </div>
    </footer>

    <!-- ============================================================
    SCRIPTS
    ============================================================ -->

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="Assets/js/firebase-config.js"></script>
    <script src="Assets/js/Orders.js"></script>

</body>
</html>

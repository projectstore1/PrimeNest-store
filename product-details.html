<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Premium store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="Assets/css/style.css">
</head>
<body>
    <div class="theme-toggle" id="themeToggle">
        <i class="fas fa-moon"></i>
    </div>

    <header class="header">
        <div class="container">
            <div class="logo">
                <img src="https://www.image2url.com/r2/default/images/1786765708686-cd1cda4a-5889-437e-9768-20204165b150.jpg" alt="PremiumStore">
                <span>Premium Store</span>
            </div>
            <nav class="nav">
                <a href="PromeNest.html"><i class="fas fa-home"></i> Home</a>
                <a href="Order_history.html"><i class="fas fa-history"></i> Orders</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="product-details-container" id="productDetails">
            <div class="product-details-grid">
                <!-- Image -->
                <div>
                    <img class="product-details-image" id="detailImage" src="" alt="">
                </div>

                <!-- Info -->
                <div class="product-details-info">
                    <h1 id="detailName">Loading...</h1>
                    <div class="product-details-price" id="detailPrice">$0.00 <span>USD</span></div>
                    <div class="product-details-naira" id="detailNaira">₦0</div>
                    <span class="product-details-status" id="detailStatus">Available</span>

                    <div class="product-details-description" id="detailDescription">
                        <i class="fas fa-info-circle" style="color:var(--accent);margin-right:8px;"></i>
                        Loading product details...
                    </div>

                    <!-- Items Section -->
                    <div class="product-items-section">
                        <h3><i class="fas fa-list" style="color:var(--accent);"></i> Select Your Item</h3>
                        <div class="items-grid" id="itemsGrid">
                            <!-- Items will be loaded from Firebase -->
                        </div>
                        <div class="no-item-selected" id="noItemSelected">
                            <i class="fas fa-exclamation-circle"></i> Please select an item
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="product-details-actions">
                        <button class="btn-buy" id="buyNowBtn">
                            <i class="fas fa-shopping-cart"></i> Buy Now
                        </button>
                        <a href="index.html" class="btn-back">
                            <i class="fas fa-arrow-left"></i> Back
                        </a>
                    </div>
                </div>
            </div>

            <!-- Similar Products -->
            <div class="similar-products" id="similarProducts">
                <h3><i class="fas fa-tags" style="color:var(--accent);"></i> You May Also Like</h3>
                <div class="similar-grid" id="similarGrid"></div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>Developed by Abdullha Khan <i class="fas fa-code"></i></p>
        </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="Assets/js/firebase-config.js"></script>
    <script src="Assets/js/product-details.js"></script>
</body>
</html>

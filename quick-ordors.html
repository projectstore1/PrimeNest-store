<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Quick Order - PremiumStore</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="cs/admin.css">
    <style>
        /* ============================================================
           QUICK ORDER PAGE EXTRA STYLES
           ============================================================ */
        .quick-container {
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
            background: var(--bg-secondary);
            border-radius: 24px;
            padding: 24px 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        .quick-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .quick-header .icon {
            font-size: 2.5rem;
            color: #1DA1F2;
            display: block;
            margin-bottom: 4px;
        }

        .quick-header h1 {
            font-size: 1.4rem;
            color: var(--text-primary);
            font-weight: 700;
        }

        .quick-header p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .product-badge {
            display: inline-block;
            background: #1DA1F2;
            color: white;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        /* ===== PLAN SELECTOR ===== */
        .plan-selector {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin: 12px 0 18px;
        }

        .plan-option {
            background: var(--bg-primary);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            padding: 14px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .plan-option:active {
            transform: scale(0.96);
        }

        .plan-option.active {
            border-color: #1DA1F2;
            background: var(--notice-bg);
            box-shadow: 0 0 0 3px rgba(29, 161, 242, 0.15);
        }

        .plan-option .plan-name {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .plan-option .plan-price {
            font-weight: 700;
            color: #1DA1F2;
            font-size: 1rem;
            margin-top: 2px;
        }

        .plan-option .plan-badge {
            font-size: 0.6rem;
            background: #dcfce7;
            color: #166534;
            padding: 2px 8px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 4px;
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 4px;
        }

        .form-group label i {
            color: #1DA1F2;
            margin-right: 4px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #1DA1F2;
            outline: none;
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* ===== SUBMIT BUTTON ===== */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #1DA1F2;
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }

        .btn-submit:active {
            transform: scale(0.97);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ===== SUCCESS ===== */
        .success-msg {
            display: none;
            background: #dcfce7;
            color: #166534;
            padding: 12px 16px;
            border-radius: 12px;
            margin-top: 14px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .success-msg.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 400px) {
            .plan-selector {
                grid-template-columns: 1fr 1fr;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .quick-container {
                padding: 18px 14px;
            }
            .quick-header h1 {
                font-size: 1.2rem;
            }
        }

        @media (max-width: 350px) {
            .plan-selector {
                grid-template-columns: 1fr;
            }
        }

        /* ===== DARK MODE OVERRIDE ===== */
        [data-theme="dark"] .plan-option.active {
            border-color: #3b82f6;
            background: #1e293b;
        }

        [data-theme="dark"] .btn-submit {
            background: #3b82f6;
        }

        [data-theme="dark"] .product-badge {
            background: #3b82f6;
        }
    </style>
</head>
<body>

    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;background:var(--bg-primary);">
        
        <div class="quick-container">

            <div class="quick-header">
                <span class="icon"><i class="fab fa-twitter"></i></span>
                <h1>⚡ Quick Order</h1>
                <p>X Premium - Fast Add</p>
            </div>

            <div style="text-align:center;">
                <span class="product-badge">🔥 Most Ordered</span>
            </div>

            <form id="quickOrderForm">

                <!-- Plan Selection -->
                <label style="font-weight:600;color:var(--text-secondary);font-size:0.85rem;display:block;margin-bottom:6px;">
                    <i class="fas fa-calendar"></i> Select Plan
                </label>
                <div class="plan-selector" id="planSelector">
                    <div class="plan-option active" data-plan="3 Month" data-price="9.99">
                        <div class="plan-name">3 Month</div>
                        <div class="plan-price">$9.99</div>
                        <div class="plan-badge">🔥 Popular</div>
                    </div>
                    <div class="plan-option" data-plan="6 Month" data-price="17.99">
                        <div class="plan-name">6 Month</div>
                        <div class="plan-price">$17.99</div>
                        <div class="plan-badge">💰 Save 10%</div>
                    </div>
                    <div class="plan-option" data-plan="12 Month" data-price="29.99">
                        <div class="plan-name">12 Month</div>
                        <div class="plan-price">$29.99</div>
                        <div class="plan-badge">⭐ Best Value</div>
                    </div>
                </div>

                <input type="hidden" id="selectedPlan" value="3 Month">
                <input type="hidden" id="selectedPrice" value="9.99">

                <!-- User Info -->
                <div class="form-group">
                    <label><i class="fas fa-user"></i> X Username / Profile Link *</label>
                    <input type="text" id="userInfo" placeholder="@username or profile link" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-tag"></i> Price (USD)</label>
                        <input type="number" id="orderPrice" step="0.01" value="9.99">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-check-circle"></i> Status</label>
                        <select id="orderStatus">
                            <option value="completed">✅ Completed</option>
                            <option value="pending">⏳ Pending</option>
                            <option value="cancelled">❌ Cancelled</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fas fa-bolt"></i> Add Order
                </button>

                <div class="success-msg" id="successMsg">
                    <i class="fas fa-check-circle"></i> Order added successfully!
                </div>

            </form>

        </div>

    </div>

    <!-- ============================================================
    SCRIPTS
    ============================================================ -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/quick-order.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Quick Order - PremiumStore</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="cs/admin.css">
    <style>
        /* ============================================================
           QUICK ORDER PAGE EXTRA STYLES
           ============================================================ */
        body {
            background: #0a0a0a !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .quick-container {
            max-width: 500px;
            width: 100%;
            background: #111111;
            border-radius: 24px;
            padding: 24px 20px;
            border: 1px solid #222;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        .quick-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .quick-header .icon {
            font-size: 2.5rem;
            color: #1DA1F2;
            display: block;
            margin-bottom: 4px;
        }

        .quick-header h1 {
            font-size: 1.4rem;
            color: #ffffff;
            font-weight: 700;
        }

        .quick-header p {
            color: #888;
            font-size: 0.85rem;
        }

        .product-badge {
            display: inline-block;
            background: #1DA1F2;
            color: #000;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        /* ===== PLAN SELECTOR ===== */
        .plan-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 12px 0 18px;
        }

        .plan-option {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 14px;
            padding: 16px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .plan-option:active {
            transform: scale(0.96);
        }

        .plan-option.active {
            border-color: #1DA1F2;
            background: #1a2a3a;
            box-shadow: 0 0 0 3px rgba(29, 161, 242, 0.15);
        }

        .plan-option .plan-name {
            font-weight: 700;
            color: #ffffff;
            font-size: 0.95rem;
        }

        .plan-option .plan-price {
            font-weight: 700;
            color: #1DA1F2;
            font-size: 1.1rem;
            margin-top: 2px;
        }

        .plan-option .plan-badge {
            font-size: 0.6rem;
            background: #dcfce7;
            color: #166534;
            padding: 2px 8px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 4px;
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #aaa;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }

        .form-group label i {
            color: #1DA1F2;
            margin-right: 4px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #333;
            border-radius: 12px;
            background: #1a1a1a;
            color: #ffffff;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #1DA1F2;
            outline: none;
        }

        .form-group input::placeholder {
            color: #666;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* ===== BUTTONS ===== */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #1DA1F2;
            color: #000;
            border: none;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }

        .btn-submit:active {
            transform: scale(0.97);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ===== SUCCESS ===== */
        .success-msg {
            display: none;
            background: #dcfce7;
            color: #166534;
            padding: 12px 16px;
            border-radius: 12px;
            margin-top: 14px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .success-msg.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== ORDERS LIST ===== */
        .orders-list {
            margin-top: 20px;
            border-top: 1px solid #333;
            padding-top: 16px;
            max-height: 300px;
            overflow-y: auto;
        }

        .orders-list::-webkit-scrollbar {
            width: 4px;
        }

        .orders-list::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 10px;
        }

        .orders-list::-webkit-scrollbar-thumb {
            background: #1DA1F2;
            border-radius: 10px;
        }

        .orders-list h3 {
            color: #ffffff;
            font-size: 0.9rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .orders-list h3 span {
            color: #888;
            font-size: 0.75rem;
        }

        .order-item {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-item .order-info {
            flex: 1;
        }

        .order-item .order-info .order-id {
            font-weight: 700;
            color: #1DA1F2;
            font-size: 0.85rem;
        }

        .order-item .order-info .order-plan {
            color: #ffffff;
            font-size: 0.8rem;
        }

        .order-item .order-info .order-user {
            color: #888;
            font-size: 0.75rem;
        }

        .order-item .order-status {
            font-size: 0.65rem;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
            display: inline-block;
        }

        .order-item .order-status.completed {
            background: #dcfce7;
            color: #166534;
        }

        .order-item .order-status.pending {
            background: #fef3c7;
            color: #92400e;
        }

        .order-item .order-status.cancelled {
            background: #fef2f2;
            color: #dc2626;
        }

        .order-item .order-actions {
            display: flex;
            gap: 6px;
        }

        .order-item .order-actions button {
            background: none;
            border: none;
            cursor: pointer;
            color: #888;
            font-size: 0.9rem;
            padding: 4px 8px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .order-item .order-actions .btn-delete:hover {
            color: #ff4444;
            background: #2a1a1a;
        }

        .empty-orders {
            color: #666;
            text-align: center;
            padding: 20px;
            font-size: 0.85rem;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 400px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .quick-container {
                padding: 18px 14px;
            }
            .quick-header h1 {
                font-size: 1.2rem;
            }
            .plan-selector {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="quick-container">

        <div class="quick-header">
            <span class="icon"><i class="fab fa-twitter"></i></span>
            <h1>⚡ Quick Order</h1>
            <p>X Premium - Fast Add</p>
        </div>

        <div style="text-align:center;">
            <span class="product-badge">🔥 Most Ordered</span>
        </div>

        <form id="quickOrderForm">

            <!-- Plan Selection -->
            <label style="font-weight:600;color:#aaa;font-size:0.85rem;display:block;margin-bottom:6px;">
                <i class="fas fa-calendar"></i> Select Plan
            </label>
            <div class="plan-selector" id="planSelector">
                <div class="plan-option active" data-plan="3 Month" data-price="6">
                    <div class="plan-name">3 Month</div>
                    <div class="plan-price">$6</div>
                </div>
                <div class="plan-option" data-plan="6 Month" data-price="9">
                    <div class="plan-name">6 Month</div>
                    <div class="plan-price">$9</div>
                </div>
            </div>

            <input type="hidden" id="selectedPlan" value="3 Month">
            <input type="hidden" id="selectedPrice" value="6">

            <!-- User Info -->
            <div class="form-group">
                <label><i class="fas fa-user"></i> X Username / Profile Link *</label>
                <input type="text" id="userInfo" placeholder="@username or profile link" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-tag"></i> Price (USD)</label>
                    <input type="number" id="orderPrice" step="0.01" value="6">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-check-circle"></i> Status</label>
                    <select id="orderStatus">
                        <option value="completed">✅ Completed</option>
                        <option value="pending">⏳ Pending</option>
                        <option value="cancelled">❌ Cancelled</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="fas fa-bolt"></i> Add Order
            </button>

            <div class="success-msg" id="successMsg">
                <i class="fas fa-check-circle"></i> Order added successfully!
            </div>

        </form>

        <!-- ===== RECENT ORDERS ===== -->
        <div class="orders-list" id="ordersList">
            <h3>
                <span><i class="fas fa-clock"></i> Recent Orders</span>
                <span id="orderCount">0 orders</span>
            </h3>
            <div id="ordersContainer">
                <div class="empty-orders">No orders yet</div>
            </div>
        </div>

    </div>

    <!-- ============================================================
    SCRIPTS
    ============================================================ -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/quick-order.js"></script>

</body>
</html>
